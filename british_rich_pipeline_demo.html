<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>British Rich — Content Pipeline</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Playfair+Display:wght@600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#06070b;--bg2:#0a0c12;--s1:#0f1119;--s2:#151823;--s3:#1c2030;
  --b1:rgba(255,255,255,0.04);--b2:rgba(255,255,255,0.07);--b3:rgba(255,255,255,0.12);
  --t1:#eaedf4;--t2:#949bb0;--t3:#5a6078;
  --g:#c9a54f;--g2:#e2cc7a;--gbg:rgba(201,165,79,0.06);--gb:rgba(201,165,79,0.15);
  --gr:#34d399;--grbg:rgba(52,211,153,0.07);--grb:rgba(52,211,153,0.18);
  --bl:#60a5fa;--blbg:rgba(96,165,250,0.07);
  --rd:#f87171;--rdbg:rgba(248,113,113,0.07);
  --pp:#a78bfa;--ppbg:rgba(167,139,250,0.07);
  --mono:'JetBrains Mono',monospace;--sans:'Inter',system-ui,sans-serif;--serif:'Playfair Display',serif;
  --r:12px;
}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){
  --bg:#f0f1f5;--bg2:#e8eaef;--s1:#ffffff;--s2:#f6f7fa;--s3:#eceef3;
  --b1:rgba(0,0,0,0.05);--b2:rgba(0,0,0,0.08);--b3:rgba(0,0,0,0.13);
  --t1:#0f1119;--t2:#5a6078;--t3:#8b90a3;
}}
:root[data-theme="dark"]{--bg:#06070b}
*{margin:0;padding:0;box-sizing:border-box}
html,body{height:100%;overflow-x:hidden}
body{font-family:var(--sans);background:var(--bg);color:var(--t1);-webkit-font-smoothing:antialiased}

/* === BACKGROUND === */
.bg-mesh{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.bg-mesh::before{content:'';position:absolute;width:800px;height:800px;top:-200px;right:-200px;background:radial-gradient(circle,rgba(201,165,79,0.04) 0%,transparent 70%);filter:blur(80px)}
.bg-mesh::after{content:'';position:absolute;width:600px;height:600px;bottom:-100px;left:-100px;background:radial-gradient(circle,rgba(96,165,250,0.03) 0%,transparent 70%);filter:blur(80px)}

/* === LAYOUT === */
.layout{display:flex;height:100vh;position:relative;z-index:1}
.sidebar{width:64px;background:var(--s1);border-right:1px solid var(--b1);display:flex;flex-direction:column;align-items:center;padding:16px 0;flex-shrink:0}
.sb-logo{width:36px;height:36px;border-radius:10px;background:linear-gradient(135deg,var(--g),var(--g2));display:flex;align-items:center;justify-content:center;font-family:var(--serif);font-size:14px;font-weight:800;color:#080a0e;margin-bottom:24px}
.sb-nav{display:flex;flex-direction:column;gap:4px;flex:1}
.sb-item{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;font-size:16px;cursor:pointer;transition:all 0.2s;color:var(--t3);border:1px solid transparent}
.sb-item:hover{background:var(--b1);color:var(--t2)}
.sb-item.on{background:var(--gbg);color:var(--g);border-color:var(--gb)}
.sb-bottom{margin-top:auto;display:flex;flex-direction:column;gap:4px;align-items:center}

.main{flex:1;display:flex;flex-direction:column;overflow:hidden}

/* === TOP BAR === */
.topbar{height:52px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between;padding:0 24px;flex-shrink:0;background:var(--s1)}
.tb-left{display:flex;align-items:center;gap:16px}
.tb-title{font-size:13px;font-weight:700;letter-spacing:-0.01em}
.tb-sep{width:1px;height:20px;background:var(--b2)}
.tb-path{font-size:11px;color:var(--t3);font-family:var(--mono)}
.tb-right{display:flex;align-items:center;gap:12px}
.tb-badge{padding:4px 10px;border-radius:8px;font-size:10px;font-weight:700;letter-spacing:0.04em;display:flex;align-items:center;gap:5px}
.tb-live{background:var(--grbg);color:var(--gr)}
.tb-live::before{content:'';width:5px;height:5px;border-radius:50%;background:var(--gr);animation:pulse 2s infinite}
@keyframes pulse{0%,100%{opacity:1;box-shadow:0 0 0 0 rgba(52,211,153,0.3)}50%{opacity:.6;box-shadow:0 0 0 5px rgba(52,211,153,0)}}

/* === STATS BAR === */
.stats-bar{display:flex;gap:1px;border-bottom:1px solid var(--b1);flex-shrink:0;background:var(--b1)}
.stat-cell{flex:1;background:var(--s1);padding:14px 20px;display:flex;align-items:center;gap:12px}
.stat-icon{width:34px;height:34px;border-radius:9px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.stat-val{font-size:18px;font-weight:700;font-family:var(--mono);letter-spacing:-0.02em}
.stat-label{font-size:9px;color:var(--t3);text-transform:uppercase;letter-spacing:0.08em;margin-top:1px}

/* === CONTENT AREA === */
.content{flex:1;overflow-y:auto;padding:24px}
.content::-webkit-scrollbar{width:6px}
.content::-webkit-scrollbar-track{background:transparent}
.content::-webkit-scrollbar-thumb{background:var(--b2);border-radius:3px}

.container{max-width:920px;margin:0 auto}

/* === CARDS === */
.card{background:var(--s1);border:1px solid var(--b1);border-radius:var(--r);overflow:hidden}
.card+.card{margin-top:16px}
.ch{padding:14px 20px;border-bottom:1px solid var(--b1);display:flex;align-items:center;justify-content:space-between}
.ch-t{font-size:10px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.08em;display:flex;align-items:center;gap:8px}
.cb{padding:20px}

/* === FORM === */
.fg{display:grid;gap:14px}
.fr2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.fr3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px}
.fr4{display:grid;grid-template-columns:1fr 1fr 1fr 1fr;gap:12px}
.fl{display:block;font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:5px}
.fi,.fs,.ft{width:100%;background:var(--s2);border:1px solid var(--b1);border-radius:9px;padding:10px 13px;color:var(--t1);font-family:var(--sans);font-size:12.5px;outline:none;transition:all 0.2s}
.fi:focus,.ft:focus,.fs:focus{border-color:var(--g);box-shadow:0 0 0 3px rgba(201,165,79,0.06)}
.ft{resize:vertical;min-height:68px;line-height:1.6}
.fs{appearance:none;background-image:url("data:image/svg+xml,%3Csvg width='10' height='6' viewBox='0 0 10 6' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1l4 4 4-4' stroke='%235a6078' stroke-width='1.5' stroke-linecap='round'/%3E%3C/svg%3E");background-repeat:no-repeat;background-position:right 12px center;padding-right:32px;cursor:pointer}

/* === BUTTONS === */
.btn-g{width:100%;padding:12px;border:none;border-radius:10px;background:linear-gradient(135deg,var(--g),#b89440);color:#080a0e;font-family:var(--sans);font-size:12px;font-weight:700;cursor:pointer;transition:all 0.25s;letter-spacing:0.01em}
.btn-g:hover{box-shadow:0 6px 28px rgba(201,165,79,0.2);transform:translateY(-1px)}
.btn-g:active{transform:translateY(0)}
.btn-g:disabled{opacity:0.3;transform:none;box-shadow:none;cursor:default}

/* === PIPELINE === */
.pipe-wrap{padding:16px 20px}
.p-step{display:flex;align-items:center;gap:14px;padding:9px 12px;border-radius:9px;transition:all 0.35s;position:relative}
.p-step+.p-step{margin-top:2px}
.p-step.w{opacity:0.25}.p-step.r{background:var(--gbg);opacity:1}.p-step.d{opacity:0.85}
.p-dot{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;flex-shrink:0;border:1.5px solid var(--b2);background:var(--s2);transition:all 0.3s;font-family:var(--mono);font-weight:600}
.p-step.r .p-dot{border-color:var(--g);background:var(--gbg);box-shadow:0 0 16px rgba(201,165,79,0.12)}
.p-step.d .p-dot{border-color:var(--gr);background:var(--grbg);color:var(--gr)}
.p-info{flex:1;min-width:0}
.p-name{font-size:12px;font-weight:600}.p-sub{font-size:10px;color:var(--t3);margin-top:1px;font-family:var(--mono)}
.p-time{font-size:10px;font-family:var(--mono);color:var(--t3)}

/* === TABS === */
.tabs{display:flex;gap:3px;padding:3px;background:var(--s1);border:1px solid var(--b1);border-radius:11px;margin-bottom:16px;overflow-x:auto}
.tab{padding:8px 14px;border-radius:8px;font-size:11px;font-weight:600;cursor:pointer;transition:all 0.2s;white-space:nowrap;color:var(--t3);border:1px solid transparent}
.tab:hover{color:var(--t2)}.tab.on{background:var(--gbg);color:var(--g);border-color:var(--gb)}

/* === CONTENT PANELS === */
.pi{background:var(--s2);border:1px solid var(--b1);border-radius:10px;padding:20px;line-height:1.85;font-size:13px;white-space:pre-line}
.rtl{direction:rtl;text-align:right}
.badge{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;font-size:9px;font-weight:700;letter-spacing:0.04em}
.b-en{background:var(--blbg);color:var(--bl)}.b-ar{background:var(--gbg);color:var(--g)}
.b-ok{background:var(--grbg);color:var(--gr)}.b-warn{background:var(--rdbg);color:var(--rd)}

/* === PHONE MOCKUP === */
.phone-grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media(max-width:700px){.phone-grid{grid-template-columns:1fr}.fr4{grid-template-columns:1fr 1fr}}
.phone-wrap{display:flex;flex-direction:column;align-items:center}
.phone-label{font-size:9px;font-weight:700;color:var(--t3);text-transform:uppercase;letter-spacing:0.08em;margin-bottom:10px}
.phone{width:100%;max-width:280px;border-radius:24px;border:2px solid var(--b2);background:var(--bg2);overflow:hidden;box-shadow:0 8px 40px rgba(0,0,0,0.25)}
.ph-notch{height:28px;display:flex;align-items:center;justify-content:center;gap:6px;padding:0 16px}
.ph-notch-dot{width:6px;height:6px;border-radius:50%;background:var(--b2)}
.ph-notch-bar{width:40px;height:4px;border-radius:2px;background:var(--b2)}
.ph-head{display:flex;align-items:center;gap:7px;padding:6px 12px;border-bottom:1px solid var(--b1)}
.ph-av{width:22px;height:22px;border-radius:50%;background:linear-gradient(135deg,var(--g),var(--g2));display:flex;align-items:center;justify-content:center;font-size:7px;font-weight:800;color:#000;flex-shrink:0}
.ph-name{font-size:10px;font-weight:700}.ph-loc{font-size:8px;color:var(--t3)}
.ph-img{width:100%;aspect-ratio:1;background:linear-gradient(145deg,#0e1525,#080e18);display:flex;align-items:center;justify-content:center;position:relative}
.ph-img span{font-size:44px;opacity:0.5}
.ph-price{position:absolute;bottom:8px;left:8px;background:rgba(0,0,0,0.6);backdrop-filter:blur(8px);padding:3px 8px;border-radius:6px;font-size:10px;font-weight:700;color:var(--g);font-family:var(--mono)}
.ph-actions{display:flex;gap:12px;padding:7px 12px;font-size:15px;opacity:0.4}
.ph-cap{padding:4px 12px 14px;font-size:10px;line-height:1.6;color:var(--t2)}
.ph-cap b{color:var(--t1)}
.ph-home{height:4px;width:36px;border-radius:2px;background:var(--b2);margin:8px auto 10px}

/* === BROCHURE === */
.broch{text-align:center;padding:36px 28px;border:1px solid var(--b1);border-radius:14px;background:linear-gradient(170deg,var(--s1) 0%,var(--s2) 100%);position:relative;overflow:hidden}
.broch::before{content:'';position:absolute;top:-40px;right:-40px;width:200px;height:200px;border-radius:50%;background:radial-gradient(circle,rgba(201,165,79,0.04),transparent 70%)}
.broch-t{font-family:var(--serif);font-size:22px;font-weight:700;margin:14px 0 4px}
.broch-p{font-size:24px;font-weight:800;background:linear-gradient(135deg,var(--g),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin:18px 0 2px;font-family:var(--mono)}
.broch-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:18px 0}
.broch-s{padding:14px;border-radius:10px;background:var(--s2);border:1px solid var(--b1)}
.broch-sv{font-size:18px;font-weight:700;font-family:var(--mono)}
.broch-sl{font-size:8px;color:var(--t3);margin-top:2px;text-transform:uppercase;letter-spacing:0.08em}

/* === APPROVE === */
.apr-grid{display:grid;grid-template-columns:2fr 1fr 1fr;gap:8px}
.apr-btn{padding:11px;border:none;border-radius:10px;font-family:var(--sans);font-size:11px;font-weight:600;cursor:pointer;transition:all 0.2s}
.apr-yes{background:var(--gr);color:#000}.apr-yes:hover{box-shadow:0 4px 16px rgba(52,211,153,0.2)}
.apr-ed{background:var(--s2);color:var(--t2);border:1px solid var(--b1)}.apr-ed:hover{border-color:var(--b3)}
.apr-no{background:var(--s2);color:var(--t2);border:1px solid var(--b1)}.apr-no:hover{border-color:rgba(248,113,113,0.2)}

/* === PUBLISHED === */
.pub{border:1px solid var(--grb);border-radius:var(--r);overflow:hidden;background:var(--s1)}
.pub-h{padding:16px 20px;display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--b1)}
.pub-ic{width:38px;height:38px;border-radius:50%;background:var(--grbg);display:flex;align-items:center;justify-content:center;color:var(--gr);font-size:16px;flex-shrink:0;border:1.5px solid var(--grb)}
.ch-row{display:flex;align-items:center;justify-content:space-between;padding:12px 20px;border-bottom:1px solid var(--b1)}
.ch-row:last-of-type{border-bottom:none}
.ch-l{display:flex;align-items:center;gap:10px}
.ch-i{width:32px;height:32px;border-radius:8px;background:var(--s2);display:flex;align-items:center;justify-content:center;font-size:14px;border:1px solid var(--b1)}
.ch-n{font-size:12px;font-weight:600}
.ch-s{font-size:10px;font-weight:700;font-family:var(--mono)}
.leads{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;padding:16px 20px;border-top:1px solid var(--b1)}
.lead{text-align:center;padding:14px;border-radius:10px;background:var(--s2);border:1px solid var(--b1)}
.lead-v{font-size:18px;font-weight:700;font-family:var(--mono)}
.lead-l{font-size:8px;color:var(--t3);margin-top:3px;text-transform:uppercase;letter-spacing:0.08em}

.hidden{display:none!important}
.fade{animation:fadeUp .4s ease}
@keyframes fadeUp{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}
.pop{animation:popIn .45s cubic-bezier(.34,1.56,.64,1)}
@keyframes popIn{from{opacity:0;transform:scale(.97)}to{opacity:1;transform:scale(1)}}
</style>
</head>
<body>
<div class="bg-mesh"></div>
<div class="layout">
  <!-- SIDEBAR -->
  <div class="sidebar">
    <div class="sb-logo">BR</div>
    <div class="sb-nav">
      <div class="sb-item on" title="Pipeline">⚡</div>
      <div class="sb-item" title="Properties">🏠</div>
      <div class="sb-item" title="Content">📝</div>
      <div class="sb-item" title="Analytics">📊</div>
      <div class="sb-item" title="Leads">👤</div>
      <div class="sb-item" title="Settings">⚙️</div>
    </div>
    <div class="sb-bottom">
      <div class="sb-item" title="Help">❓</div>
    </div>
  </div>

  <!-- MAIN -->
  <div class="main">
    <!-- TOP BAR -->
    <div class="topbar">
      <div class="tb-left">
        <span class="tb-title">Content Pipeline</span>
        <span class="tb-sep"></span>
        <span class="tb-path">pipeline / new-listing</span>
      </div>
      <div class="tb-right">
        <span class="tb-badge tb-live">LIVE</span>
        <span style="font-size:10px;color:var(--t3);font-family:var(--mono)">v1.0.0</span>
      </div>
    </div>

    <!-- STATS BAR -->
    <div class="stats-bar">
      <div class="stat-cell"><div class="stat-icon" style="background:var(--gbg);color:var(--g)">📥</div><div><div class="stat-val" id="sv1">0</div><div class="stat-label">Properties This Week</div></div></div>
      <div class="stat-cell"><div class="stat-icon" style="background:var(--blbg);color:var(--bl)">📤</div><div><div class="stat-val" id="sv2">0</div><div class="stat-label">Posts Published</div></div></div>
      <div class="stat-cell"><div class="stat-icon" style="background:var(--ppbg);color:var(--pp)">👤</div><div><div class="stat-val" id="sv3">0</div><div class="stat-label">Leads Captured</div></div></div>
      <div class="stat-cell"><div class="stat-icon" style="background:var(--grbg);color:var(--gr)">✅</div><div><div class="stat-val">94%</div><div class="stat-label">Approval Rate</div></div></div>
    </div>

    <!-- SCROLLABLE CONTENT -->
    <div class="content">
      <div class="container">
        <!-- INTAKE -->
        <div class="card" id="intakeCard">
          <div class="ch"><span class="ch-t">📥 Property Intake</span><span class="badge b-en">Step 1 of 4</span></div>
          <div class="cb"><div class="fg">
            <div class="fr2">
              <div><label class="fl">Property Title</label><input class="fi" id="iT" value="Luxury Penthouse, Canary Wharf"></div>
              <div><label class="fl">Price (£)</label><input class="fi" id="iP" value="£1,250,000"></div>
            </div>
            <div class="fr4">
              <div><label class="fl">Beds</label><input class="fi" id="iB" value="3"></div>
              <div><label class="fl">Baths</label><input class="fi" id="iBa" value="2"></div>
              <div><label class="fl">Sq Ft</label><input class="fi" id="iS" value="1,850"></div>
              <div><label class="fl">Type</label><select class="fs" id="iTy"><option>Penthouse</option><option>Apartment</option><option>House</option><option>Villa</option></select></div>
            </div>
            <div class="fr2">
              <div><label class="fl">Location</label><input class="fi" id="iL" value="Canary Wharf, London E14"></div>
              <div><label class="fl">Nearest Station</label><input class="fi" id="iSt" value="Canary Wharf (Jubilee/Elizabeth)"></div>
            </div>
            <div><label class="fl">Key Features</label><textarea class="ft" id="iF">Panoramic River Thames views, 42nd floor, private wraparound balcony, Italian marble bathrooms, Gaggenau kitchen, 24hr concierge, residents' gym & pool, underground parking</textarea></div>
            <div class="fr2">
              <div><label class="fl">Target Audience</label><select class="fs" id="iA"><option>International Investors</option><option>First-Time Buyers</option><option>Families</option></select></div>
              <div><label class="fl">Content Tone</label><select class="fs" id="iTo"><option>Luxury & Exclusive</option><option>Professional</option><option>Warm & Inviting</option></select></div>
            </div>
            <button class="btn-g" id="goBtn" onclick="go()">⚡ Generate Content</button>
          </div></div>
        </div>

        <!-- PIPELINE -->
        <div class="card hidden" id="pipeCard">
          <div class="ch"><span class="ch-t">⚙️ Pipeline</span><span class="badge b-en" id="pTimer" style="font-family:var(--mono)">0.0s</span></div>
          <div class="pipe-wrap" id="pipeSteps"></div>
        </div>

        <!-- OUTPUT -->
        <div class="hidden" id="outWrap">
          <div class="tabs" id="tabs"></div>
          <div id="tabBody"></div>
          <div class="card" style="margin-top:16px" id="aprCard">
            <div class="ch"><span class="ch-t">✅ Review & Approve</span><span style="font-size:9px;color:var(--t3)">Nothing publishes without your approval</span></div>
            <div class="cb"><div class="apr-grid">
              <button class="apr-btn apr-yes" onclick="pub()">✅ Approve & Publish All</button>
              <button class="apr-btn apr-ed" onclick="alert('Opens editor with AI-suggested revisions')">✏️ Edit</button>
              <button class="apr-btn apr-no" onclick="alert('Discarded. Feedback logged for prompt tuning.')">❌ Reject</button>
            </div></div>
          </div>
        </div>

        <!-- PUBLISHED -->
        <div class="hidden" id="pubWrap"></div>
      </div>
    </div>
  </div>
</div>

<script>
const ST=[{i:'📥',n:'Receiving property data',s:'Validating fields'},{i:'🤖',n:'Writing English listing',s:'GPT-5.6 Luna · Luxury tone'},{i:'🌍',n:'Writing Arabic listing',s:'Cultural adaptation · RTL'},{i:'📸',n:'Crafting Instagram post',s:'EN + AR · Hashtags'},{i:'🎬',n:'Crafting TikTok post',s:'Hook-first · Trending'},{i:'📘',n:'Crafting Facebook post',s:'Storytelling · EN + AR'},{i:'🎨',n:'Building brochure',s:'Canva auto-fill'},{i:'✅',n:'All content ready',s:'7 assets · Awaiting review'}];
const TB=[{id:'len',l:'📝 Listing EN'},{id:'lar',l:'📝 وصف العقار'},{id:'ig',l:'📸 Instagram'},{id:'tk',l:'🎬 TikTok'},{id:'fb',l:'📘 Facebook'},{id:'br',l:'🎨 Brochure'}];
let D={},ct='len';
const v=id=>document.getElementById(id).value;
const sl=ms=>new Promise(r=>setTimeout(r,ms));

async function go(){
  const btn=document.getElementById('goBtn');btn.disabled=true;btn.textContent='Processing...';
  const pc=document.getElementById('pipeCard');pc.classList.remove('hidden');
  document.getElementById('outWrap').classList.add('hidden');
  document.getElementById('pubWrap').classList.add('hidden');
  const ps=document.getElementById('pipeSteps'),pt=document.getElementById('pTimer');
  let t0=Date.now();const tm=setInterval(()=>{pt.textContent=((Date.now()-t0)/1000).toFixed(1)+'s'},100);
  for(let i=0;i<ST.length;i++){
    ps.innerHTML=ST.map((s,j)=>`<div class="p-step ${j<i?'d':j===i?'r':'w'}"><span class="p-dot">${j<i?'✓':s.i}</span><div class="p-info"><div class="p-name">${s.n}</div><div class="p-sub">${s.s}</div></div>${j===i?'<span class="p-time">running</span>':j<i?'<span class="p-time" style="color:var(--gr)">done</span>':''}</div>`).join('');
    await sl(480+Math.random()*320);
  }
  clearInterval(tm);
  const[title,price,beds,baths,sqft,type,loc,station,feat]=
    [v('iT'),v('iP'),v('iB'),v('iBa'),v('iS'),v('iTy'),v('iL'),v('iSt'),v('iF')];
  try{
    const sample=await claude.use("sample");if(!sample)throw 0;
    const r=await sample(`Property marketing for British Rich UK. ONLY JSON no markdown:\nProperty:${title},${price}(projected),${beds}bed,${baths}bath,${sqft}sqft ${type} in ${loc} near ${station}. Features:${feat}.\nRules:prices say projected,no financial advice.\n{"en":"4-sentence English listing","ar":"Arabic culturally adapted","ig_en":"Instagram EN caption+emoji+5 hashtags","ig_ar":"Instagram Arabic","tk_en":"TikTok EN hook-first","tk_ar":"TikTok Arabic","fb_en":"Facebook EN storytelling","fb_ar":"Facebook Arabic"}`);
    D=JSON.parse(r.text.replace(/```json|```/g,'').trim());
  }catch(e){
    D={en:`${title} — ${price} (projected)\n\nA breathtaking ${beds}-bedroom ${type.toLowerCase()} spanning approximately ${sqft} sq ft on the 42nd floor of one of Canary Wharf's most prestigious addresses. This exceptional residence features ${feat.toLowerCase()}, offering an unparalleled lifestyle in London's most dynamic district.\n\nMoments from ${station}, placing Mayfair just 15 minutes away. Contact British Rich to arrange an exclusive private viewing.`,
    ar:`${title} — ${price} (متوقع)\n\nشقة بنتهاوس فاخرة من ${beds} غرف نوم تمتد على مساحة تقارب ${sqft} قدم مربع في الطابق الثاني والأربعين من أحد أرقى العناوين في كناري وارف. يتميز هذا المسكن الاستثنائي بإطلالات بانورامية خلابة على نهر التايمز، وشرفة خاصة محيطة، وحمامات من الرخام الإيطالي، ومطبخ غاغيناو.\n\nعلى بُعد لحظات من محطة كناري وارف. تواصل مع بريتش ريتش لترتيب معاينة خاصة.`,
    ig_en:`🏙️ 42nd Floor Living — Canary Wharf\n\n✨ ${beds} Bed ${type} · ${sqft} sq ft\n🌊 Panoramic Thames Views\n💎 Italian Marble · Gaggenau Kitchen\n📍 ${loc}\n\n${price} (projected)\n\nDM us or link in bio 🔗\n\n#BritishRich #LondonProperty #CanaryWharf #LuxuryLiving #UKRealEstate`,
    ig_ar:`🏙️ حياة فاخرة — الطابق ٤٢ كناري وارف\n\n✨ ${beds} غرف · ${sqft} قدم مربع\n🌊 إطلالات بانورامية\n💎 رخام إيطالي · مطبخ غاغيناو\n\n${price} (متوقع)\n\nراسلنا أو الرابط في البايو 🔗\n\n#بريتش_ريتش #عقارات_لندن #كناري_وارف #فخامة #استثمار`,
    tk_en:`POV: Your new view from the 42nd floor 🌇\n\n${beds} bed penthouse · Canary Wharf\n${sqft} sq ft of pure luxury\nThames views that hit different\n\n${price} (projected)\n\nLink in bio 🔗\n\n#LondonProperty #CanaryWharf #LuxuryLiving #BritishRich`,
    tk_ar:`منظرك الجديد من الطابق ٤٢ 🌇\n\nبنتهاوس ${beds} غرف · كناري وارف\nإطلالات التايمز\n\n${price} (متوقع)\n\nالرابط في البايو 🔗\n\n#عقارات_لندن #كناري_وارف #بريتش_ريتش #فخامة`,
    fb_en:`Imagine stepping onto your private wraparound balcony, 42 floors above the Thames, watching the city light up at sunset.\n\nThis ${beds}-bedroom penthouse in Canary Wharf isn't just a home — it's a statement. At ${sqft} sq ft, every detail has been considered: Italian marble bathrooms, a Gaggenau kitchen, floor-to-ceiling windows.\n\n24-hour concierge. Gym and pool. ${station} on your doorstep.\n\n${price} (projected)\n\n📩 britishrich.co.uk`,
    fb_ar:`تخيل أن تقف على شرفتك الخاصة، في الطابق ٤٢ فوق التايمز، تشاهد المدينة تتألق عند الغروب.\n\nبنتهاوس ${beds} غرف في كناري وارف — ليس مجرد منزل بل أسلوب حياة. على مساحة ${sqft} قدم مربع، كل تفصيلة مدروسة.\n\nكونسيرج ٢٤ ساعة. صالة رياضية ومسبح.\n\n${price} (متوقع)\n\n📩 britishrich.co.uk`};
  }
  D._t=title;D._p=price;D._b=beds;D._ba=baths;D._s=sqft;D._l=loc;
  pc.classList.add('hidden');
  document.getElementById('sv1').textContent='1';
  showOut();
  btn.disabled=false;btn.textContent='⚡ Generate Content';
}

function showOut(){
  const ow=document.getElementById('outWrap');ow.classList.remove('hidden');ow.classList.add('fade');
  document.getElementById('aprCard').classList.remove('hidden');
  rTabs();rTab();
}
function rTabs(){document.getElementById('tabs').innerHTML=TB.map(t=>`<div class="tab ${t.id===ct?'on':''}" onclick="ct='${t.id}';rTabs();rTab()">${t.l}</div>`).join('')}

function rTab(){
  const tb=document.getElementById('tabBody');
  const phone=(cap,dir,lang)=>`<div class="phone-wrap"><div class="phone-label">${lang}</div><div class="phone"><div class="ph-notch"><div class="ph-notch-dot"></div><div class="ph-notch-bar"></div><div class="ph-notch-dot"></div></div><div class="ph-head" ${dir==='rtl'?'style="direction:rtl"':''}><div class="ph-av">BR</div><div ${dir==='rtl'?'style="text-align:right"':''}><div class="ph-name">britishrich</div><div class="ph-loc">${D._l}</div></div></div><div class="ph-img"><span>🏙️</span><div class="ph-price" ${dir==='rtl'?'style="left:auto;right:8px"':''}>${D._p}</div></div><div class="ph-actions" ${dir==='rtl'?'style="direction:rtl"':''}>♡ 💬 ✈️</div><div class="ph-cap ${dir==='rtl'?'rtl':''}" style="white-space:pre-line"><b>britishrich</b> ${cap}</div><div class="ph-home"></div></div></div>`;
  const V={
    len:`<div class="card fade"><div class="ch"><span class="ch-t">Property Listing</span><div style="display:flex;gap:6px"><span class="badge b-en">English</span><span class="badge b-warn">⚠ Compliance Check</span></div></div><div class="cb"><div class="pi">${D.en}</div><div style="margin-top:10px;display:flex;gap:12px;font-size:10px;color:var(--t3)"><span>✓ Figures = projected</span><span>✓ No financial advice</span><span>✓ Brand tone verified</span></div></div></div>`,
    lar:`<div class="card fade"><div class="ch"><span class="ch-t">وصف العقار</span><div style="display:flex;gap:6px"><span class="badge b-ar">العربية</span><span class="badge b-ok">✓ تكييف ثقافي</span></div></div><div class="cb"><div class="pi rtl" style="font-size:14px;line-height:2">${D.ar}</div><div style="margin-top:10px;font-size:10px;color:var(--t3);direction:rtl;text-align:right">✓ محتوى مُكيَّف ثقافياً وليس مترجماً حرفياً · ✓ أرقام متوقعة</div></div></div>`,
    ig:`<div class="fade"><div class="phone-grid">${phone(D.ig_en,'ltr','ENGLISH')}${phone(D.ig_ar,'rtl','العربية')}</div></div>`,
    tk:`<div class="fade"><div class="phone-grid">${phone(D.tk_en,'ltr','ENGLISH')}${phone(D.tk_ar,'rtl','العربية')}</div></div>`,
    fb:`<div class="fade"><div class="phone-grid">${phone(D.fb_en,'ltr','ENGLISH')}${phone(D.fb_ar,'rtl','العربية')}</div></div>`,
    br:`<div class="card fade"><div class="ch"><span class="ch-t">Brochure Preview</span><span class="badge b-en">Canva Auto-Fill</span></div><div class="cb"><div class="broch"><div style="font-size:40px;margin-bottom:6px">🏙️</div><div class="broch-t">${D._t}</div><div style="font-size:11px;color:var(--t3)">${D._l}</div><div class="broch-grid"><div class="broch-s"><div class="broch-sv">${D._b}</div><div class="broch-sl">Bedrooms</div></div><div class="broch-s"><div class="broch-sv">${D._ba}</div><div class="broch-sl">Bathrooms</div></div><div class="broch-s"><div class="broch-sv">${D._s}</div><div class="broch-sl">Sq Ft</div></div></div><div class="broch-p">${D._p}</div><div style="font-size:10px;color:var(--t3)">(projected)</div><div style="margin-top:20px;padding-top:16px;border-top:1px solid var(--b1)"><div style="font-family:var(--serif);font-size:15px;font-weight:700;background:linear-gradient(135deg,var(--g),var(--g2));-webkit-background-clip:text;-webkit-text-fill-color:transparent">British Rich</div><div style="font-size:10px;color:var(--t3);margin-top:2px">britishrich.co.uk</div></div></div></div></div>`,
  };
  tb.innerHTML=V[ct]||'';
}

function pub(){
  document.getElementById('aprCard').classList.add('hidden');
  document.getElementById('sv2').textContent='4';document.getElementById('sv3').textContent='—';
  const pw=document.getElementById('pubWrap');pw.classList.remove('hidden');
  const chs=[{i:'🌐',n:'britishrich.co.uk',s:'Published',c:'var(--gr)'},{i:'📸',n:'Instagram',s:'Queued 9:00 AM',c:'var(--bl)'},{i:'🎬',n:'TikTok',s:'Queued 12:00 PM',c:'var(--pp)'},{i:'📘',n:'Facebook',s:'Queued 10:30 AM',c:'var(--bl)'}];
  pw.innerHTML=`<div class="pub pop" style="margin-top:16px"><div class="pub-h"><div class="pub-ic">✓</div><div><div style="font-size:13px;font-weight:700;color:var(--gr)">Content Approved & Queued</div><div style="font-size:10px;color:var(--t3)">4 channels · Lead capture active · CRM pipeline ready</div></div></div>${chs.map(c=>`<div class="ch-row"><div class="ch-l"><span class="ch-i">${c.i}</span><span class="ch-n">${c.n}</span></div><span class="ch-s" style="color:${c.c}">${c.s}</span></div>`).join('')}<div class="leads"><div class="lead"><div class="lead-v" style="color:var(--gr)">0</div><div class="lead-l">Leads Today</div></div><div class="lead"><div class="lead-v" style="color:var(--g)">EN + AR</div><div class="lead-l">Nurture Active</div></div><div class="lead"><div class="lead-v" style="color:var(--bl)">Ready</div><div class="lead-l">CRM Pipeline</div></div></div></div>`;
}
</script>
